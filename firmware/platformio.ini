; Featherframe firmware — XIAO ESP32-S3 Plus on the Seeed EE03 driver board,
; driving a 10.3" ED103TC2 (1404x1872, 16-level grayscale, IT8951 T-CON).
;
; The XIAO ESP32-S3 *Plus* has 16MB flash and 8MB OPI PSRAM. The panel
; framebuffer (~1.25MB at 4bpp) lives in PSRAM, so qio_opi + BOARD_HAS_PSRAM
; are required — without them the buffer won't allocate.

[env:xiao_ee03]
; The EE03 panel only cold-inits on Arduino-ESP32 v3, and mainline espressif32
; lags it (and its 3.0.x WebServer.h fails to build with WiFiManager). Use the
; pioarduino fork's stable release (arduino-esp32 3.3.x / IDF 5.5).
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = seeed_xiao_esp32s3
framework = arduino

; --- XIAO ESP32-S3 Plus memory (Plus = 16MB flash / 8MB OPI PSRAM) ---
board_build.arduino.memory_type = qio_opi
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv

build_flags =
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DCORE_DEBUG_LEVEL=2

monitor_speed = 115200
upload_speed = 921600
; Native USB-Serial-JTAG gotcha: a plain hard_reset can leave the S3 stuck in
; download mode (it doesn't re-sample the boot straps). If `pio run -t upload`
; ends with the app not running, reset via the RTC watchdog instead, e.g.:
;   esptool --chip esp32s3 -p <port> --after watchdog_reset write_flash 0x0 \
;     .pio/build/xiao_ee03/firmware.factory.bin
; (or just tap the physical RESET/EN button once after flashing).

lib_deps =
  https://github.com/Seeed-Studio/Seeed_GFX
  https://github.com/tzapu/WiFiManager

; The Seeed_GFX panel/board selection lives in lib/driver/driver.h (combo 511).
; See that file. If the mainline espressif32 platform lags Arduino-ESP32 v3,
; switch to the pioarduino fork:
;   platform = https://github.com/pioarduino/platform-espressif32
; which also exposes a `seeed_xiao_esp32s3_plus` board id.
