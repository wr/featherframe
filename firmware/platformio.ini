; Featherframe firmware — XIAO ESP32-S3 Plus on the Seeed EE03 driver board,
; driving a 10.3" ED103TC2 (1404x1872, 16-level grayscale, IT8951 T-CON).
;
; The XIAO ESP32-S3 *Plus* has 16MB flash and 8MB OPI PSRAM. The panel
; framebuffer (~1.25MB at 4bpp) lives in PSRAM, so qio_opi + BOARD_HAS_PSRAM
; are required — without them the buffer won't allocate.

[env:xiao_ee03]
; The mainline espressif32 platform resolves to Arduino-ESP32 v2 (2.0.17), on which
; the ED103TC2/IT8951 T-CON init does NOT configure the panel from cold — nothing
; renders. The pioarduino fork provides Arduino-ESP32 v3 (IDF 5.x), which the driver
; needs. See AGENTS.md.
platform = https://github.com/pioarduino/platform-espressif32
board = seeed_xiao_esp32s3
framework = arduino

; --- XIAO ESP32-S3 Plus memory (Plus = 16MB flash / 8MB OPI PSRAM) ---
board_build.arduino.memory_type = qio_opi
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv

; Stamp the build with a git-derived FF_FW_VERSION (see tools/fw_version.py and
; docs/firmware-device-stats.md §1). Inherited by the envs that `extends` this one.
extra_scripts = pre:tools/fw_version.py

build_flags =
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DCORE_DEBUG_LEVEL=2

monitor_speed = 115200
upload_speed = 921600

lib_deps =
  https://github.com/Seeed-Studio/Seeed_GFX
  https://github.com/tzapu/WiFiManager

; The Seeed_GFX panel/board selection lives in lib/driver/driver.h (combo 511).
; See that file. If the mainline espressif32 platform lags Arduino-ESP32 v3,
; switch to the pioarduino fork:
;   platform = https://github.com/pioarduino/platform-espressif32
; which also exposes a `seeed_xiao_esp32s3_plus` board id.

; The binary that ships in a kit (W-768): `pio run -e release` on a clean clone.
; Same app as xiao_ee03 — nothing per-unit or per-network is compiled in (the
; server is found by mDNS, the power model and poll gap arrive from the server,
; the battery read carries no per-board trim) — with the core's debug logging
; off. On a clean checkout of a v* tag it reports that version.
[env:release]
extends = env:xiao_ee03
build_flags =
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DCORE_DEBUG_LEVEL=0

; The same, for the EE02 colour kit.
[env:release_ee02]
extends = env:release
build_flags =
  ${env:release.build_flags}
  -DFF_BOARD_EE02

; Throwaway env for on-hardware key-pin discovery (W-574). Build with
;   pio run -e keyscan -t upload
[env:keyscan]
extends = env:xiao_ee03
build_src_filter = -<*> +<../test_keyscan/keyscan.cpp>
lib_deps =

; Bare panel hello-world: proves the ED103TC2 renders with nothing else running.
[env:hello]
extends = env:xiao_ee03
build_src_filter = -<*> +<../test_hello/hello.cpp>
lib_deps =
  https://github.com/Seeed-Studio/Seeed_GFX

; The Featherframe firmware for the EE02 board + 13.3" Spectra 6 colour panel
; (W-812): same app, FF_PANEL_SPECTRA6 fallbacks for everything the gray build
; does with partial refreshes. Pair it with a server instance of its own — the
; server renders for the panel named in X-Panel, and hosts this env's
; firmware.bin for OTA (`make ota` pushes xiao_ee03's; do not cross them).
[env:ee02]
extends = env:xiao_ee03
build_flags =
  ${env:xiao_ee03.build_flags}
  -DFF_BOARD_EE02

; Bare panel hello-world for the EE02 board + 13.3" Spectra 6 colour panel
; (combo 510): six colour bars, proving the panel before any port.
[env:ee02_hello]
extends = env:xiao_ee03
build_src_filter = -<*> +<../test_hello_ee02/hello_ee02.cpp>
build_flags =
  ${env:xiao_ee03.build_flags}
  -DFF_BOARD_EE02
lib_deps =
  https://github.com/Seeed-Studio/Seeed_GFX

; Refresh-speed bench for the Spectra 6 panel: times the stock refresh, forces
; the waveform temperature (CCSET/TSSET), and cuts a refresh short by reset.
; Serial-driven and idle at boot; see the header of the source. Not for shipping.
[env:ee02_bench]
extends = env:ee02_hello
build_src_filter = -<*> +<../test_bench_ee02/bench_ee02.cpp>

; On-bench toast harness (W-574): stays awake on USB, loops the partial-refresh
; toast so the pill can be verified without buttons/battery. Not for shipping.
[env:toastdebug]
extends = env:xiao_ee03
build_flags =
  ${env:xiao_ee03.build_flags}
  -DFF_DEBUG_TOAST
