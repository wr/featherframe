<!doctype html>
<!-- The Featherframe flasher on GitHub Pages (W-840): the same esp-web-tools
     install the dashboard offers, for a dashboard on plain http, which cannot
     reach USB. Published beside the latest release's parts by
     .github/workflows/release.yml; manifests/<kit>.json names them. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Featherframe Flasher</title>
<meta name="description" content="Install Featherframe on a frame over USB.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital@0;1&display=swap">
<script type="module" src="esp-web-tools/install-button.js"></script>
<style>
  :root {
    --bg:#ececea; --surface:#fcfcfb; --inset:#e9e9e5;
    --ink:#201e1a; --ink-2:#474540; --muted:#827e76; --border:#e6e4dd;
    --accent:#6b4a2c; --accent-press:#523821; --on-accent:#f7efe2;
    color-scheme:light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg:#1b1a18; --surface:#242320; --inset:#2e2c29;
      --ink:#f1efea; --ink-2:#cfccc4; --muted:#9a968d; --border:#35332f;
      --accent:#c49a6c; --accent-press:#d8ae80; --on-accent:#1b1a18;
      color-scheme:dark;
    }
  }
  :root[data-theme="dark"] {
    --bg:#1b1a18; --surface:#242320; --inset:#2e2c29;
    --ink:#f1efea; --ink-2:#cfccc4; --muted:#9a968d; --border:#35332f;
    --accent:#c49a6c; --accent-press:#d8ae80; --on-accent:#1b1a18;
    color-scheme:dark;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
         font:15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  main { max-width:520px; margin:0 auto; padding:48px 16px; }
  h1 { font:italic 34px/1.1 "EB Garamond", Georgia, serif; margin:0 0 6px; }
  .ver { color:var(--muted); font-size:13px; margin:0 0 28px; }
  .card { background:var(--surface); border:1px solid var(--border); border-radius:9px; padding:20px; }
  .lab { font-weight:600; font-size:14px; display:block; margin-bottom:8px; }
  .seg { display:flex; background:var(--inset); border-radius:7px; padding:3px; gap:3px; }
  .seg label { flex:1; }
  .seg input { position:absolute; opacity:0; width:0; height:0; }
  .seg span { display:block; text-align:center; padding:8px 6px; border-radius:5px; font-size:13.5px;
              color:var(--muted); cursor:pointer; }
  .seg input:checked + span { background:var(--surface); color:var(--ink); box-shadow:0 1px 2px rgba(0,0,0,.12); }
  .seg input:focus-visible + span { outline:2px solid var(--accent); outline-offset:2px; }
  p { color:var(--ink-2); font-size:14px; margin:16px 0 0; }
  .go { display:flex; justify-content:flex-end; margin-top:18px; }
  button { font:inherit; font-weight:600; border:0; border-radius:7px; padding:10px 18px; cursor:pointer;
           background:var(--accent); color:var(--on-accent); }
  button:hover { background:var(--accent-press); }
  ol { color:var(--ink-2); font-size:14px; padding-left:1.2em; margin:18px 0 0; }
  ol li + li { margin-top:6px; }
</style>
</head>
<body>
<main>
  <h1>Featherframe</h1>
  <p class="ver" id="ver"></p>
  <div class="card">
    <span class="lab" id="kit-lab">Kit</span>
    <div class="seg" role="radiogroup" aria-labelledby="kit-lab">
      <label><input type="radio" name="kit" value="ee03" checked><span>10.3″ gray</span></label>
      <label><input type="radio" name="kit" value="ee02"><span>13.3″ colour</span></label>
    </div>
    <p id="note">Plug the frame in by USB, then Connect.</p>
    <div class="go">
      <esp-web-install-button id="install" manifest="manifests/ee03.json">
        <button slot="activate" type="button">Connect</button>
        <span slot="unsupported"><p>Needs Chrome or Edge on a computer.</p></span>
      </esp-web-install-button>
    </div>
    <ol>
      <li>Connect, and pick the frame's port.</li>
      <li>Install. Leave <em>Erase</em> off to keep the frame's Wi-Fi.</li>
      <li>Give it a network if it asks.</li>
      <li>Add it on your Featherframe page when it asks to connect.</li>
    </ol>
  </div>
</main>
<script>
  (function () {
    var inst = document.getElementById('install');
    function pick(kit) {
      inst.setAttribute('manifest', 'manifests/' + kit + '.json');
      var r = document.querySelector('input[name="kit"][value="' + kit + '"]');
      if (r) r.checked = true;
    }
    var want = new URLSearchParams(location.search).get('kit');
    if (want === 'ee03' || want === 'ee02') pick(want);
    document.querySelectorAll('input[name="kit"]').forEach(function (r) {
      r.addEventListener('change', function () { pick(r.value); });
    });
    fetch('firmware-manifest.json').then(function (r) { return r.json(); }).then(function (m) {
      document.getElementById('ver').textContent = 'Version ' + m.version;
    }).catch(function () {});
  })();
</script>
</body>
</html>
