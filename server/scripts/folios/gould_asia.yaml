# Featherframe — John Gould's "The Birds of Asia" (W-871).
#
# A folio is one historical edition of plates; see folios/havell.yaml and
# folios/gould_europe.yaml, whose fields this file shares. What differs:
#
#   volume_no   the volume the plate is numbered in: each volume prints its own
#               List of Plates, and a plate is cited "Asia, iv. pl. 49"
#               (Sharpe's 1893 index). `plate` is its number in that list.
#   volume, leaf  the Smithsonian copy on BHL / Internet Archive. The copy is
#               bound in List order, plate n at leaf `first + 4(n-1)` (first =
#               28 in vol. I, 12 in the others). The plates carry no pencil
#               number; every pairing was checked against the text leaf bound
#               right after the plate, which names the species.
#   gould_title the plate's own English name and the Latin of its engraved
#               caption (informational).
#
# Pinned: every plate whose species BirdNET knows by its modern name (the
# survey's exact and probable rows, docs/gould-survey/asia-plates.csv),
# cross-checked against the Kansas catalogue (docs/gould-asia/). Left out:
# species BirdNET does not know, and every plate of a *form* — a race Gould
# named as a species, now a subspecies that can look nothing like the bird a
# station hears (the caniceps trap, at 16% of this folio). The traps:
#   - V.17 Carduelis orientalis is the grey-headed caniceps goldfinch, not the
#     European Goldfinch (Europe pl. 196 is).
#   - I.35, printed "Merops viridis, Linn.", shows the Green Bee-eater (Merops
#     orientalis); Linnaeus's viridis is today's Blue-throated Bee-eater, which
#     this folio does not show. The same kind of trap as Europe's gulls: match
#     on the bird, never the printed Latin.
#   - IV.32 Rhodophila melanoleuca is Jerdon's Bushchat, not the Pied Bushchat.
#   - V.53 Cissa pyrrhocyanea is the Sri Lanka Blue-Magpie, not a green magpie.
#   - II.75 Psaropholus ardens, III.53 Garrulax picticollis, IV.43 Accentor
#     erythropygius, IV.70 Enicurus chinensis and V.35 Pyrrhula orientalis are
#     forms of the Maroon Oriole, Greater Necklaced Laughingthrush, Alpine
#     Accentor, White-crowned Forktail and Eurasian Bullfinch.
#   - VII.39 Phasianus torquatus is the one form pinned, on purpose (below).
# Shared with Europe: 12 species are in both Gould folios; the Asia region
# asks this one first, every other region asks it before Europe (the folios
# after the region's own go in file order).

folio:
  title: "The Birds of Asia"
  artist: "John Gould, with H. C. Richter, Joseph Wolf and William Hart"
  years: "1850–1883"
  plates: 530
  region: asia
  plates_per_volume: true
  margins: [0.02, 0.02, 0.96, 0.97]
  # The gilt board edge and the page stack run down the left of every upright
  # plate in vols. I-V, to about 0.105 of the sheet: past it,
  # the tight crop takes the stack for art and keeps the whole sheet. A
  # sideways plate there names its own margins (the stack turned to the top),
  # as does an upright one whose caption sets its bottom.
  volume_margins:
    BirdsAsiaJohnGoIGoul: [0.12, 0.02, 0.96, 0.97]
    BirdsAsiaJohnGoIIGoul: [0.12, 0.02, 0.96, 0.97]
    BirdsAsiaJohnGoIIIGoul: [0.12, 0.02, 0.96, 0.97]
    BirdsAsiaJohnGoIVGoul: [0.12, 0.02, 0.96, 0.97]
    BirdsAsiaJohnGoVGoul: [0.12, 0.02, 0.96, 0.97]
  flatten: true
  tight: true
  source: "Smithsonian Libraries, via the Biodiversity Heritage Library"
  credit: "Smithsonian Libraries and Archives, via the Biodiversity Heritage Library. Public domain."
  scans: "https://bhl-open-data.s3.us-east-2.amazonaws.com/images/{volume}/{volume}_{leaf:04d}.jp2"

