# Featherframe — John Gould's "The Birds of Australia" and its Supplement (W-870).
#
# A folio is one historical edition of plates; see folios/havell.yaml and
# folios/gould_europe.yaml. The Australia Region asks this folio first; any
# other Region asks it only for a species Havell and Europe lack.
#
# Fields, per species:
#   common, scientific, sci_synonyms   as in folios/havell.yaml
#   volume_no   the volume as Gould numbers it (1-7, or "Supp."): each volume
#               prints its own List of Plates, and a plate is cited by volume
#               and number ("Australia, ii. pl. 18"). The sheet has no number.
#   plate       the plate's number in that volume's List
#   gould_title the List's English name and the plate's engraved Latin
#               (informational)
#   volume      the Internet Archive / BHL id of the volume
#   leaf        the scan's leaf number in that volume (IA's, from 1, no gaps)
#   rotate      degrees counter-clockwise (PIL's sense) to stand a sideways
#               plate upright, caption along the bottom: 270 for a caption
#               down the right edge, 90 for the few with it up the left
#   margins     [left, top, right, bottom] of the upright sheet kept before
#               the crop. An upright plate's bottom stops just above its
#               engraved caption, measured on the scan, and its right edge
#               at 0.955, clear of the binding line every volume shows at
#               0.963-0.99. A sideways plate's are the box of its strong
#               ink, padded: its caption and the binding's shadow along its
#               bottom are faint on the cleared paper and fall outside; where
#               the art runs into the shadow, the bottom is set by eye.
#
# The Smithsonian copy is bound in List order, a plate every four leaves.
# Every pin's leaf was read against its engraved caption, its species
# against Gould's own text, and against the Kansas catalogue (docs/
# gould-australia/). One plate per species: the one bearing its own name,
# else the first. Traps — Gould's binomial now names another bird, so match
# on the pinned modern name, never on his:
#   - Pachycephala pectoralis (II.67) is the Rufous Whistler, not the Golden.
#   - Myiagra nitida (II.91) is the Satin Flycatcher; his "Shining
#     Flycatcher" English name now belongs to II.88.
#   - Circus assimilis (I.26) is the Swamp Harrier; the Spotted Harrier is
#     his C. jardinii (I.27).
#   - Climacteris picumnus (IV.98) is the White-throated Treecreeper; the
#     Brown Treecreeper is his C. scandens (IV.93).
#   - Rallus pectoralis (VI.76) is the Buff-banded Rail; Lewin's Rail is VI.77.
#   - Oreocincla lunulata (IV.7) is the Bassian Thrush, not the Mountain
#     Thrush of Central America.
#   - Acanthiza diemenensis (III.54) is the Brown Thornbill; the Tasmanian
#     Thornbill is III.55.

folio:
  title: "The Birds of Australia"
  artist: "John and Elizabeth Gould, with H. C. Richter"
  years: "1840–1869"
  plates: 681
  region: australia
  plates_per_volume: true
  margins: [0.02, 0.02, 0.98, 0.97]
  flatten: true
  tight: true
  source: "Smithsonian Libraries, via the Biodiversity Heritage Library"
  credit: "Smithsonian Libraries and Archives, via the Biodiversity Heritage Library. Public domain."
  scans: "https://bhl-open-data.s3.us-east-2.amazonaws.com/images/{volume}/{volume}_{leaf:04d}.jp2"
  # When BHL fails: the same sheets, already cleaned, in the open dataset's
  # release (W-875), checked against its manifest.
  release: "https://github.com/wr/historical-bird-plates/releases/download/gould-australia-v1"

