# Featherframe — the Gould folio: John Gould's "The Birds of Europe" (W-702).
#
# A folio is one historical edition of plates; see folios/havell.yaml. Havell
# is asked first, so this folio only ever draws a species Audubon never
# painted — the introductions North American stations hear most — until the
# Region setting puts Europe first.
#
# Fields, per species:
#   common, scientific, sci_synonyms, composite   as in folios/havell.yaml
#   plate       Gould's number from the General List of Plates (vol. I), the
#               book's own numbering: the plates were issued unnumbered, and
#               each Smithsonian copy carries its number in pencil
#   gould_title the plate's engraved caption (informational)
#   volume      the Internet Archive / BHL id of the volume the plate is bound in
#   leaf        the scan's leaf number in that volume (IA's, from 1, no gaps)
#   rotate      degrees counter-clockwise (PIL's sense) to stand a landscape plate upright
#               (its caption then runs along the bottom)
#   legend      the plate's own caption line for this species, on a sheet
#               that shows more than one
#   margins     [left, top, right, bottom], the part of the (upright) sheet
#               kept before the crop. The folio's own is only the sheet's
#               edge; a plate whose art runs close to its caption can name
#               its own.
#   (folio-wide: `flatten` clears the paper to white at fetch time; `tight`
#   crops to the art's own box — see the folio header)
#
# Every pin was checked by eye against the engraved caption on the scan and
# the number against the printed General List. Traps:
#   - Gould's "Black-headed Gull" (Xema melanocephala, plate 427) is today's
#     Mediterranean Gull; the modern Black-headed Gull is his "Laughing Gull"
#     (Xema ridibunda, plate 425), and today's (American) Laughing Gull is his
#     "Black-winged Gull" (Xema atricilla, plate 426). Match on the modern
#     binomial, never the common name.
#   - The grey-headed "caniceps" goldfinch in Gould's Birds of Asia is not the
#     European Goldfinch (docs/plate-sources.md); plate 196 here is.

folio:
  title: "The Birds of Europe"
  artist: "John Gould, with Edward Lear"
  years: "1832–1837"
  plates: 449
  region: europe
  # Only the sheet's own edge: the tight crop stops at the paper gap above
  # the caption and beside the pencilled number, whatever the orientation.
  margins: [0.02, 0.02, 0.98, 0.97]
  flatten: true
  # Crop to the art's own box: a Gould sheet is one vignette on a lot of paper.
  tight: true
  source: "Smithsonian Libraries, via the Biodiversity Heritage Library"
  credit: "Smithsonian Libraries and Archives, via the Biodiversity Heritage Library. Public domain."
  # The full-resolution masters on BHL's public S3 bucket (no key needed).
  scans: "https://bhl-open-data.s3.us-east-2.amazonaws.com/images/{volume}/{volume}_{leaf:04d}.jp2"

species:
  # --- The introductions: what a North American station hears that Audubon never painted
  - {common: "House Sparrow",         scientific: "Passer domesticus",  plate: 184, gould_title: "1. House Sparrow. 2. Tree Sparrow.", volume: birdsEuropeIIIGoul, leaf: 150, margins: [0.02, 0.02, 0.98, 0.865], composite: true, legend: ["1. House Sparrow."]}
  - {common: "European Starling",     scientific: "Sturnus vulgaris",   plate: 210, gould_title: "Starling",         volume: birdsEuropeIIIGoul, leaf: 254, margins: [0.02, 0.02, 0.98, 0.894]}
  - {common: "Rock Pigeon",           scientific: "Columba livia",      plate: 245, gould_title: "Rock Dove",        volume: birdsEuropeIVGoul,  leaf: 22, margins: [0.02, 0.02, 0.98, 0.826]}
  - {common: "Ring-necked Pheasant",  scientific: "Phasianus colchicus", plate: 247, gould_title: "Common Pheasant", volume: birdsEuropeIVGoul,  leaf: 30,  rotate: 270}
  - {common: "Mute Swan",             scientific: "Cygnus olor",        plate: 354, gould_title: "Domestic Swan, Cygnus mansuetus", volume: birdsEuropeVGoul, leaf: 46, rotate: 270}
