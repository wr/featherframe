  - {common: "Black-headed Gull",     scientific: "Chroicocephalus ridibundus", plate: 425, gould_title: "Laughing Gull, Xema ridibundus", volume: birdsEuropeVGoul, leaf: 330, rotate: 270, sci_synonyms: ["Larus ridibundus"]}
  # The House Sparrow's sheet also shows the Tree Sparrow, as figure 2.
  - {common: "Eurasian Tree Sparrow", scientific: "Passer montanus",    plate: 184, gould_title: "1. House Sparrow. 2. Tree Sparrow.", volume: birdsEuropeIIIGoul, leaf: 150, margins: [0.02, 0.02, 0.98, 0.865], composite: true, legend: ["2. Tree Sparrow."]}

