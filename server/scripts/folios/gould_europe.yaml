  # --- Decided by Wells on the review page (25 Sep 2026), checked against
  # Dresser's synonymies and the Kansas (Ellis) catalogue. A plate drawn before
  # its species was split stands for both daughters (Orphean, Bonelli's, the
  # two magpies; Gould's "Melodious Willow Wren" is Dresser's Icterine, and
  # the plate serves the Melodious too). Gould's Dalmatian Regulus is Pallas's
  # Leaf Warbler (pale rump, crown stripe), not the Yellow-browed; his Imperial
  # Eagle has the eastern bird's white scapulars, not the Spanish bird's white
  # wing edge. Cetti's, the White Wagtail and the Common Snipe keep their main
  # plates; Gould's second figures of them are not pinned.
