# Audubon's printed plate legends — the lines engraved under each plate's title
# and Latin name in the Havell edition: the figure key ("Male, 1. Female, 2.") and
# the plant or setting ("Black berry. Rubus villosus."). Keyed by Havell plate
# number. Transcribed from the scans' caption bands on 4 Sep 2026 (W-708); spelling
# and punctuation are Audubon's own ("Chesnut", "Black berry"). The title line, the
# Latin name and the engraver credits are never included.
#
#   lines      legend lines in reading order (may be empty: some plates carry
#              nothing beyond the title and Latin name)
#   composite  true when several species share the sheet; then each species'
#              figure key is prefixed with its printed title ("Black-capt
#              Titmouse, 3. Male, 4. Female.") and featherframe.legends picks the
#              detected species' line at index time
#   uncertain  the type was faint, tiny, or the scan is cut off below the Latin
#              line; the reading is a best effort (see note)
#
# fetch_plates.py merges these into plates/index.json as each species' "legend".
