  # --- Full Havell edition (2026-09): every remaining plate --------------
  # Built from two independent sources — Wikimedia Commons' per-plate species
  # categories and the Havell titles (Commons gallery + the mirror's fileName
  # slug) — then read against the titles by hand. Modern names are the ones
  # BirdNET emits (v2.4 range list, v3.0 NA-east, en_uk labels with US
  # spellings), with IOC/Commons binomials kept as synonyms. Extinct and far
  # out-of-range species are included so the plate map is complete; BirdNET
  # never emits them. The 76 rows whose modern name shares no word with the
  # title were verified one by one against audubon.org, Pitt's Havell
  # catalogue and NYHS (3 Sep 2026). Left out on purpose (never a wrong bird):
  # the invalid or disputed birds — 11 Bird of Washington, 55 Cuvier's Kinglet,
  # 60 Carbonated Warbler, 164 Tawny Thrush (Veery, disputed), 184 Mangrove
  # Humming Bird, 338 Bemaculated Duck (hybrid), 400 Townsend's Bunting, 407
  # Dusky Albatros (Pitt/NYHS: Light-mantled; Commons: Sooty — unsettled), 434
  # Small-headed Flycatcher and Blue Mountain Warbler, and the fifth "species"
