# Featherframe — curated species list and Audubon plate crosswalk.
#
# This is the editable source of truth for `fetch_plates.py`. Each entry pins a
# modern species (as BirdNET reports it) to a specific Havell-edition plate in
# John James Audubon's "Birds of America" (public domain).
#
# Fields:
#   common      modern common name (matches BirdNET's Com_Name)
#   scientific  modern binomial (matches BirdNET's Sci_Name)
#   plate       Havell plate number 1..435, or `none` if Audubon never painted it
#   audubon_title  Audubon's 1830s plate title (informational; captions use the
#                  modern name). Handy because many are archaic.
#   composite   true if the plate shows several species — the composer then
#               shows the whole plate rather than risk cropping to a wrong bird.
#   sci_synonyms  older binomials BirdNET might emit (taxonomic splits/renames).
#   crop_box    optional [x, y, w, h] in 0..1 to hand-place the crop (rarely needed).
#
# Every plate below was verified against the actual plate index, not guessed.
# To add a species: add an entry. If you omit `plate`, fetch_plates will suggest
# one by title match and print it for you to pin here.

species:
